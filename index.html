<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreya Mektebi - 登录</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #5a6fd6; }
        .tip { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Koreya Mektebi</h2>
    <p style="color: #666; font-size: 14px;">请输入您的电子邮箱进行安全登录</p>
    <input type="email" id="emailInput" placeholder="name@example.com">
    <button onclick="sendLoginLink()">发送邮箱验证链接</button>
    <div class="tip">我们将向该邮箱发送一封无密码登录邮件</div>
</div>

<!-- 引入 Firebase 核心服务和身份验证插件 -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // 你的专属项目钥匙
    const firebaseConfig = {
        apiKey: "AIzaSyAhw7XJEd9JWTvtKd21ZuYPy9CoWv4yvuY",
        authDomain: "://firebaseapp.com",
        projectId: "korey-learning",
        storageBucket: "://appspot.com",
        messagingSenderId: "394690421532",
        appId: "1:394690421532:web:e82aa4d375f92772d989d9"
    };
    firebase.initializeApp(firebaseConfig);

    // 发送邮件的逻辑
    function sendLoginLink() {
        const email = document.getElementById('emailInput').value;
        if (!email) {
            alert('请先输入有效的邮箱地址！');
            return;
        }

        const actionCodeSettings = {
            // 验证成功后，自动完美跳转回你的 GitHub 线上韩语主页 home.html
            url: 'https://github.io', 
            handleCodeInApp: true
        };

        firebase.auth().sendSignInLinkToEmail(email, actionCodeSettings)
            .then(() => {
                window.localStorage.setItem('emailForSignIn', email);
                alert('安全验证邮件已发送！请前往您的邮箱点击链接完成登录。');
            })
            .catch((error) => {
                alert('发送失败: ' + error.message);
            });
    }
</script>

</body>
</html>
